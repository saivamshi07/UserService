spring.application.name=user-service
spring.config.import=classpath:user-policy.yml

# Database URL, Username, and Password
spring.datasource.url=jdbc:postgresql://localhost:5432/userServiceDB
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT Configuration
# At least 256 bits (32+ characters) for HMAC-SHA256
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
jwt.cookie.secure=false
jwt.cookie.same-site=Strict

# S3 / MinIO Storage Configuration
storage.s3.endpoint=http://localhost:9000
storage.s3.region=us-east-1
storage.s3.bucket-name=user-avatars
storage.s3.access-key=minioadmin
storage.s3.secret-key=minioadmin
storage.s3.path-style-access-enabled=true
storage.s3.presigned-url-expiration-minutes=15

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Topics
kafka.topics.user-registered=user.registered.v1
kafka.topics.user-deactivated=user.deactivated.v1

# Transactional Outbox Publisher
outbox.publisher.enabled=true
outbox.publisher.fixed-delay-ms=2000
