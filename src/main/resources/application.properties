spring.application.name=user-service
spring.config.import=classpath:user-policy.yml

# ==============================================================================
# 1. PostgreSQL Database Configuration
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/userServiceDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings (In prod, DDL auto is typically 'validate' or managed via Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# 2. Redis Sessions & Token Revocation
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000ms}

# ==============================================================================
# 3. Security, JWT & Cookies
# ==============================================================================
# At least 256 bits (32+ characters) for HMAC-SHA256 (In prod, inject via secret manager)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# In production with HTTPS/TLS, set JWT_COOKIE_SECURE=true
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Strict}

# API Gateway Shared Secret for anti-spoofing header verification
gateway.secret=${GATEWAY_SHARED_SECRET:local-dev-gateway-secret}

# ==============================================================================
# 4. S3 / MinIO Object Storage Configuration
# ==============================================================================
# For AWS S3, set S3_ENDPOINT to https://s3.us-east-1.amazonaws.com and S3_PATH_STYLE_ACCESS=false
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.bucket-name=${S3_BUCKET_NAME:user-avatars}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.path-style-access-enabled=${S3_PATH_STYLE_ACCESS:true}
storage.s3.presigned-url-expiration-minutes=${S3_PRESIGNED_EXPIRATION_MINUTES:15}

# ==============================================================================
# 5. Apache Kafka Event Streaming
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:all}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}

# Kafka Topics
kafka.topics.user-registered=${KAFKA_TOPIC_USER_REGISTERED:user.registered.v1}
kafka.topics.user-deactivated=${KAFKA_TOPIC_USER_DEACTIVATED:user.deactivated.v1}

# ==============================================================================
# 6. Transactional Outbox Publisher
# ==============================================================================
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
outbox.publisher.fixed-delay-ms=${OUTBOX_PUBLISHER_DELAY_MS:2000}
